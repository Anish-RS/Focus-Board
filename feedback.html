<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedback — Focus Board</title>
<meta name="description" content="Post an idea or a bug for Focus Board. Every post and every reply is public." />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --wood:#8a6438; --cork:#B98A54; --ink:#2B2620; --cream:#FBF8F1; --paper:#F4EEDF;
    --butter:#F5E6A8; --butter-ink:#6B4E12;
    --sage:#C9D6B8; --sage-ink:#3A4B24;
    --sky:#B9D3DD; --sky-ink:#20424C;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Work Sans', sans-serif; color:var(--ink);
    background:var(--wood);
    background-image:
      radial-gradient(rgba(0,0,0,0.25) 1px, transparent 1.6px),
      radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1.7px);
    background-size:15px 15px, 23px 23px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 24px 90px; }
  nav{ max-width:760px; margin:0 auto; padding:24px; display:flex; justify-content:space-between; align-items:center; }
  nav a{ color:var(--cream); text-decoration:none; font-family:'Fraunces', serif; font-weight:600; font-size:18px; }
  nav .back{ font-family:'Work Sans', sans-serif; font-weight:600; font-size:13.5px; opacity:0.85; text-decoration:underline; }
  h1{ font-family:'Fraunces', serif; color:var(--cream); font-size:clamp(28px,4vw,38px); font-weight:600; margin:0 0 8px; }
  .tagline{ color:rgba(251,248,241,0.85); font-size:15px; max-width:52ch; line-height:1.55; margin-bottom:34px; }

  .composer{
    background:var(--cream); border-radius:6px; padding:22px 22px 20px;
    box-shadow:3px 6px 16px rgba(0,0,0,0.28); margin-bottom:40px;
  }
  .composer label{ display:block; font-size:12px; font-weight:700; color:#5c5346; margin-bottom:5px; }
  .composer input, .composer textarea{
    width:100%; border:1.5px solid rgba(43,38,32,0.16); border-radius:5px;
    padding:10px 11px; font-family:'Work Sans', sans-serif; font-size:14.5px; margin-bottom:14px;
    resize:vertical;
  }
  .composer input:focus, .composer textarea:focus{ outline:none; border-color:var(--wood); }
  .composer-row{ display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .char-count{ font-size:12px; color:#8a8070; }
  .post-btn{
    background:var(--ink); color:var(--cream); border:none; border-radius:5px;
    padding:11px 22px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .post-btn:hover{ background:#453d32; }
  .post-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .composer-msg{ font-size:13px; margin-top:10px; color:var(--cream); min-height:16px; }

  .thread-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
  .thread-head h2{ font-family:'Fraunces', serif; color:var(--cream); font-size:19px; font-weight:600; margin:0; }
  .thread-count{ color:rgba(251,248,241,0.7); font-size:13px; }

  .post{
    position:relative;
    background:var(--butter); color:var(--butter-ink);
    padding:18px 20px 20px; margin-bottom:18px;
    box-shadow:2px 5px 12px rgba(0,0,0,0.22);
    transform:rotate(-0.5deg);
  }
  .post:nth-child(even){ background:var(--sky); color:var(--sky-ink); transform:rotate(0.5deg); }
  .post-meta{ display:flex; justify-content:space-between; font-size:12px; font-weight:700; opacity:0.75; margin-bottom:8px; }
  .post-message{ font-size:14.5px; line-height:1.5; white-space:pre-wrap; }
  .post-reply{
    margin-top:14px; padding-top:12px; border-top:1px dashed rgba(0,0,0,0.18);
    font-size:13.5px; line-height:1.5;
  }
  .post-reply b{ font-family:'Fraunces', serif; }
  .empty-state, .load-state{ color:rgba(251,248,241,0.75); font-size:14px; padding:20px 0; }
</style>
</head>
<body>
<nav>
  <a href="./index.html">Focus Board</a>
  <a class="back" href="./index.html">&larr; Back to site</a>
</nav>

<div class="wrap">
  <h1>Feedback, out in the open</h1>
  <p class="tagline">Post a bug, an idea, or a "this confused me." Everyone can see every post here, and when something gets looked at, the reply goes right below it — no inbox, nothing private.</p>

  <div class="composer">
    <label for="fb-author">Name (optional)</label>
    <input type="text" id="fb-author" placeholder="Anonymous" maxlength="60" />
    <label for="fb-message">What's on your mind?</label>
    <textarea id="fb-message" rows="3" maxlength="500" placeholder="e.g. It'd help if reminders could repeat every weekday, not just once."></textarea>
    <div class="composer-row">
      <span class="char-count" id="fb-count">500 characters left</span>
      <button class="post-btn" id="fb-submit">Post feedback</button>
    </div>
    <div class="composer-msg" id="fb-msg"></div>
  </div>

  <div class="thread-head">
    <h2>The thread</h2>
    <span class="thread-count" id="fb-thread-count"></span>
  </div>
  <div id="fb-list"><div class="load-state">Loading\u2026</div></div>
</div>

<script src="js/config-loader.js"></script>
<script>
(function () {
  "use strict";

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function timeAgo(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    var days = Math.floor(hrs / 24);
    if (days < 30) return days + "d ago";
    return new Date(iso).toLocaleDateString();
  }

  var messageInput = document.getElementById("fb-message");
  var authorInput = document.getElementById("fb-author");
  var countEl = document.getElementById("fb-count");
  var submitBtn = document.getElementById("fb-submit");
  var msgEl = document.getElementById("fb-msg");
  var listEl = document.getElementById("fb-list");
  var threadCountEl = document.getElementById("fb-thread-count");

  messageInput.addEventListener("input", function () {
    countEl.textContent = (500 - messageInput.value.length) + " characters left";
  });

  function client() {
    return window.supabase.createClient(window.STB_SUPABASE_URL, window.STB_SUPABASE_ANON_KEY);
  }

  function renderPosts(rows) {
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty-state">No posts yet \u2014 be the first to leave one.</div>';
      threadCountEl.textContent = "";
      return;
    }
    threadCountEl.textContent = rows.length + (rows.length === 1 ? " post" : " posts");
    listEl.innerHTML = rows.map(function (row) {
      var reply = row.response
        ? '<div class="post-reply"><b>Anish replied:</b> ' + escapeHtml(row.response) + "</div>"
        : "";
      return (
        '<div class="post">' +
        '<div class="post-meta"><span>' + escapeHtml(row.author || "Anonymous") + "</span><span>" + timeAgo(row.created_at) + "</span></div>" +
        '<div class="post-message">' + escapeHtml(row.message) + "</div>" +
        reply +
        "</div>"
      );
    }).join("");
  }

  function loadPosts() {
    if (!window.STB_SUPABASE_URL) {
      listEl.innerHTML = '<div class="empty-state">Feedback board isn\u2019t connected yet.</div>';
      return;
    }
    client().from("feedback").select("author, message, response, created_at").order("created_at", { ascending: false }).limit(100)
      .then(function (res) {
        if (res.error) { listEl.innerHTML = '<div class="empty-state">Couldn\u2019t load the thread right now.</div>'; return; }
        renderPosts(res.data || []);
      });
  }

  function canPostAgain() {
    var last = 0;
    try { last = parseInt(window.localStorage.getItem("stb_fb_last_post") || "0", 10); } catch (e) {}
    return Date.now() - last > 60000;
  }

  submitBtn.addEventListener("click", function () {
    var message = messageInput.value.trim();
    var author = authorInput.value.trim() || "Anonymous";
    if (!message) { msgEl.textContent = "Write something first."; return; }
    if (!canPostAgain()) { msgEl.textContent = "One post per minute \u2014 give it a moment."; return; }
    if (!window.STB_SUPABASE_URL) { msgEl.textContent = "Feedback board isn\u2019t connected yet."; return; }
    submitBtn.disabled = true;
    msgEl.textContent = "Posting\u2026";
    client().from("feedback").insert({ author: author, message: message }).then(function (res) {
      submitBtn.disabled = false;
      if (res.error) { msgEl.textContent = res.error.message; return; }
      try { window.localStorage.setItem("stb_fb_last_post", String(Date.now())); } catch (e) {}
      messageInput.value = "";
      countEl.textContent = "500 characters left";
      msgEl.textContent = "Posted. Thanks!";
      loadPosts();
    });
  });

  var configReady = window.STB && window.STB.configReady && typeof window.STB.configReady.then === "function" ? window.STB.configReady : Promise.resolve();
  configReady.then(loadPosts, loadPosts);
})();
</script>
</body>
</html>
