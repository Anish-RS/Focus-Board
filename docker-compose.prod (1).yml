# Production overlay for the focus-board stack.
#
# Key differences from the local docker-compose.yml:
#   1. Services use `image:` (pull from a registry) instead of `build:`.
#      Jenkins builds and pushes these images -- the server never builds
#      anything, it just pulls and runs. Smaller attack surface, faster
#      deploys, and the server doesn't need your source code or a Node
#      toolchain at all.
#   2. cloudflared replaces the gateway's direct port publish. It makes an
#      OUTBOUND-only connection to Cloudflare's network, so no ports need
#      to be opened/forwarded on this machine or your router -- this is
#      what makes it work behind CGNAT / a home network with no public IP.
#      Cloudflare terminates HTTPS at their edge; traffic reaches this
#      container already decrypted, over plain HTTP to the gateway.
#   3. Secrets (JWT_SECRET, POSTGRES_PASSWORD, TUNNEL_TOKEN) come from a
#      .env file that lives ONLY on the server, never in git, never
#      touched by Jenkins.
#
# Usage on the server (Jenkins runs this over SSH during the Deploy stage):
#   REGISTRY=docker.io/yourusername IMAGE_TAG=<git-sha> \
#     docker compose -f docker-compose.prod.yml up -d --remove-orphans
#
# For a manual first run, IMAGE_TAG defaults to "latest".

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the server's .env file}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - focus-board-net

  auth-service:
    image: ${REGISTRY}/focus-board-auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the server's .env file}
      PORT: 4001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - focus-board-net

  board-service:
    image: ${REGISTRY}/focus-board-board-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/board_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the server's .env file}
      PORT: 4002
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - focus-board-net

  reminder-service:
    image: ${REGISTRY}/focus-board-reminder-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/board_db
      PORT: 4003
      POLL_INTERVAL_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4003/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - focus-board-net

  frontend:
    image: ${REGISTRY}/focus-board-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - focus-board-net

  gateway:
    image: ${REGISTRY}/focus-board-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No `ports:` here -- nothing in this stack publishes ports anymore.
    # cloudflared is the only container that talks to the outside world,
    # and it does so outbound-only.
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      board-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - focus-board-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # No `ports:` -- this container only makes an outbound connection to
    # Cloudflare's edge. Nothing needs to be open/forwarded on this
    # machine or your router.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in the server's .env file}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - focus-board-net

networks:
  focus-board-net:
    driver: bridge

volumes:
  postgres-data:
