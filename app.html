<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nudgeboard</title>
<meta name="description" content="A cork board of sticky notes with weekly recurring routines and daily tasks that carry over when unfinished." />
<meta name="color-scheme" content="light" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2B2620" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sticky Board" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preload" href="fonts/worksans-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
<script src="vendor/supabase-js-2.119.0.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<a class="stb-skip-link" href="#stb-board">Skip to the board</a>

<div class="stb-root" id="stb-root">
  <div class="stb-auth" id="stb-auth"></div>
  <header class="stb-header">
    <div class="stb-header-titles">
      <h1 class="stb-title">Today's board</h1>
      <p class="stb-date-wrap">
        <span class="stb-date" id="stb-date"></span>
        <span class="stb-sync-status" id="stb-sync-status"><span class="stb-sync-dot" aria-hidden="true"></span><span>Saved</span></span>
      </p>
    </div>
    <div class="stb-header-actions">
      <button class="stb-reminder-btn" id="stb-reminder-btn" type="button"></button>
      <button class="stb-install-btn" id="stb-install-btn" style="display:none;" type="button"></button>
      <button class="stb-add-btn stb-add-btn--doc" id="stb-add-doc-btn" type="button"></button>
      <button class="stb-add-btn" id="stb-add-btn" type="button"></button>
    </div>
  </header>

  <div class="stb-readonly-banner" id="stb-readonly-banner" role="status"></div>

  <div id="stb-ios-tip"></div>

  <div class="stb-main" role="main">
    <div class="stb-board" id="stb-board" tabindex="-1"></div>
    <aside class="stb-clipboard" id="stb-clipboard" aria-label="Today's progress"></aside>
  </div>
</div>

<div class="stb-toasts" id="stb-toasts" role="status" aria-live="polite"></div>

<script src="js/constants.js"></script>
<script src="js/helpers.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/popout.js"></script>
<script src="js/events.js"></script>
<script src="js/reminders.js"></script>
<script src="js/toast.js"></script>
<script src="js/undo.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/sync-status.js"></script>
<script src="js/config-loader.js"></script>
<script src="js/currency.js"></script>
<script src="js/sync.js"></script>
<script src="js/desktop-app.js"></script>
<script src="js/solo-mode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
